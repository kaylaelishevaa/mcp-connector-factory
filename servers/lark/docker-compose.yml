services:
  lark-mcp:
    build: .
    image: lark-mcp-server:local
    container_name: lark-mcp
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Internal port only; cloudflared exposes via tunnel.
    expose:
      - "8080"
    # For local debug, expose to host as well:
    # ports:
    #   - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lark-mcp-tunnel
    restart: unless-stopped
    env_file:
      - .env
    # Named (remotely-managed) tunnel → stable URL https://lark-mcp.example.com.
    # The tunnel + its public hostname (→ http://lark-mcp:8080) are configured
    # in the Cloudflare Zero Trust dashboard; CF_TUNNEL_TOKEN authenticates this
    # connector. To fall back to an ephemeral quick tunnel, replace the command
    # with: tunnel --no-autoupdate --url http://lark-mcp:8080
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - lark-mcp
