name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.server }} suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [lark, web]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: servers/${{ matrix.server }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
        env:
          LOG_ROOT: /tmp/${{ matrix.server }}-logs
